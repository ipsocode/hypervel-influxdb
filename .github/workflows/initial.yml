# Imported from ipsocode/hypervel-packages github/workflows/initial.yml. Edit it there.
name: initial

on:
  workflow_call:

permissions:
  contents: read

jobs:
  conventions:
    name: Conventions
    runs-on: ubuntu-latest
    timeout-minutes: 5

    concurrency:
      group: tests-${{ github.event.pull_request.number || github.ref }}-initial
      cancel-in-progress: ${{ github.ref_name != 'main' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the conventions
        run: php .github/scripts/conventions.php
