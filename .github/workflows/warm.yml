# Imported from ipsocode/hypervel-packages github/workflows/warm.yml. Edit it there.
name: warm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  OTEL_SDK_DISABLED: 'true'

jobs:
  caches:
    name: PHP ${{ matrix.php }} caches
    runs-on: ubuntu-latest
    timeout-minutes: 6

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    concurrency:
      group: warm-${{ github.ref }}-${{ matrix.php }}
      cancel-in-progress: true

    container:
      image: ghcr.io/ipsocode/hypervel/ci-alpine:${{ matrix.php }}-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ipsocode/hypervel-packages-ci/tests/install@ed1673a0c70ab3fa9f5e93e804db084b51eeb34e # v1
        with:
          php: ${{ matrix.php }}

      - name: Warm the tools' caches
        uses: ipsocode/hypervel-packages-ci/warm/caches@ed1673a0c70ab3fa9f5e93e804db084b51eeb34e # v1
        with:
          style: ${{ matrix.php == '8.4' }}
