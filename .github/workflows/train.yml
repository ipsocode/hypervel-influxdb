# Imported from ipsocode/hypervel-packages github/workflows/train.yml. Edit it there.
name: train

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: train
  cancel-in-progress: false

jobs:
  train:
    name: Weekly fixes train
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Open next week's train, carry unfinished parts over, open this week's PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TOKEN: ${{ secrets.TRAIN_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          summary() {
            echo "$1"
            echo "$1" >> "${GITHUB_STEP_SUMMARY}"
          }

          trains() {
            gh api --paginate "repos/${REPO}/issues?state=open&labels=bug&per_page=100" \
              --jq '.[] | select(.pull_request | not) | select(.title | startswith("[Tracking] Fixes for ")) | "\(.title | ltrimstr("[Tracking] Fixes for "))\t\(.number)\t\(.milestone.number // "")"'
          }

          if [ -z "${PR_TOKEN}" ]; then
            echo "::error::The TRAIN_TOKEN secret is not set. The train's pull request would open without CI and without ipsocode as its author, which the final-PR review refuses."
            exit 1
          fi
          if ! GH_TOKEN="${PR_TOKEN}" gh api user --jq .login > /dev/null; then
            echo "::error::TRAIN_TOKEN does not authenticate (expired or revoked). Replace it before the train's pull request can open."
            exit 1
          fi

          today=$(date -u +%F)
          release="${today}"
          until [ "$(date -u -d "${release}" +%u)" = 2 ] && [ "${release}" != "${today}" ]; do
            release=$(date -u -d "${release} + 1 day" +%F)
          done

          current=""
          current_line=$(trains | awk -F '\t' -v d="${release}" '$1 == d' | head -n 1)
          if [ -n "${current_line}" ]; then
            IFS=$'\t' read -r _ current _ <<< "${current_line}"
            next=$(date -u -d "${release} + 7 days" +%F)
          elif [ "${release}" = "$(date -u -d "${today} + 1 day" +%F)" ]; then
            next=$(date -u -d "${release} + 7 days" +%F)
          else
            next="${release}"
          fi

          trains | awk -F '\t' -v d="${today}" '$1 < d { print "Stale train #" $2 " (" $1 ") is still open." }' | while read -r line; do summary "${line}"; done

          # Open next week's train: milestone, umbrella, linked branch, body.
          next_title="[Tracking] Fixes for ${next}"
          new=""
          new_ms=""
          next_line=$(trains | awk -F '\t' -v d="${next}" '$1 == d' | head -n 1)
          if [ -n "${next_line}" ]; then
            IFS=$'\t' read -r _ new new_ms <<< "${next_line}"
            summary "The train for ${next} is #${new}; reusing it."
          else
            new_ms=$(gh api --paginate "repos/${REPO}/milestones?state=all&per_page=100" --jq ".[] | select(.title == \"${next}\") | .number" | head -n 1)
            if [ -z "${new_ms}" ]; then
              new_ms=$(gh api -X POST "repos/${REPO}/milestones" -f title="${next}" -f due_on="${next}T12:00:00Z" --jq .number)
              summary "Created milestone ${next}."
            fi
            created=$(gh api -X POST "repos/${REPO}/issues" -f title="${next_title}" -f body="Setting up." -f "labels[]=bug" -F milestone="${new_ms}")
            new=$(jq -r '.number' <<< "${created}")

            branch="bug-fixes/fixes-${next:2}"
            if ! gh issue develop "${new}" --repo "${REPO}" --base main --name "${branch}"; then
              if ! gh api "repos/${REPO}/git/matching-refs/heads/${branch}" --jq '.[].ref' | grep -qxF "refs/heads/${branch}"; then
                echo "gh issue develop failed and ${branch} does not exist."
                exit 1
              fi
            fi
            summary "Created #${new} and \`${branch}\`."
          fi

          branch="bug-fixes/fixes-${next:2}"
          line="**Base branch: \`${branch}\`.** Commit fixes straight to \`${branch}\`. Its pull request into \`main\` opens on the Monday before the release and closes this issue when it merges."

          # Carry unfinished parts over.
          moved=$(mktemp)
          if [ -n "${current}" ]; then
            while IFS=$'\t' read -r id num _; do
              [ -n "${num}" ] || continue
              gh api -X POST "repos/${REPO}/issues/${new}/sub_issues" -F sub_issue_id="${id}" -F replace_parent=true > /dev/null
              part_body=$(gh api "repos/${REPO}/issues/${num}" --jq '.body // ""')
              part_new=$(jq -rn --arg body "${part_body}" --arg line "${line}" '
                ($body | gsub("\r"; "") | split("\n") | map(select(test("Base branch: `") | not)) | join("\n") | sub("^\\s+"; "")) as $rest
                | [$line, $rest] | map(select(. != "")) | join("\n\n")
              ')
              gh api -X PATCH "repos/${REPO}/issues/${num}" -F milestone="${new_ms}" -f body="${part_new}" > /dev/null
              gh api -X POST "repos/${REPO}/issues/${num}/comments" -f body="Moved from #${current} to #${new}: it was not finished before the ${release} release." > /dev/null
              echo "${num}" >> "${moved}"
              summary "Moved #${num} from #${current} to #${new}."
            done < <(gh api --paginate "repos/${REPO}/issues/${current}/sub_issues?per_page=100" --jq '.[] | select(.state == "open") | "\(.id)\t\(.number)\t\(.title)"')

            if [ -s "${moved}" ]; then
              old_body=$(gh api "repos/${REPO}/issues/${current}" --jq '.body // ""')
              while read -r num; do
                old_body=$(jq -rn --arg b "${old_body}" --arg n "${num}" --arg new "${new}" '$b | gsub("(?m)^- \\[ \\] #" + $n + "[^\\n]*"; "- ~~#" + $n + "~~ — moved to #" + $new)')
              done < "${moved}"
              gh api -X PATCH "repos/${REPO}/issues/${current}" -f body="${old_body}" > /dev/null
            fi
          fi

          # Write the new umbrella's body from its sub-issues.
          parts=$(gh api --paginate "repos/${REPO}/issues/${new}/sub_issues?per_page=100" --jq '.[] | "- [\(if .state == "closed" then "x" else " " end)] #\(.number) — \(.title)"')
          footer="> **How this issue works.** Bug and performance issues attach themselves to the current train as sub-issues. The nightly routine fixes each one with a commit on this branch, closes it and ticks its box. What is unfinished on Monday moves to the next train. On the Monday before the Tuesday release the branch's pull request into \`main\` opens, gets the final review and closes this issue when it merges."
          new_body=$(printf '%s\n\n## Parts\n\n%s\n\n%s\n' "${line}" "${parts}" "${footer}")
          gh api -X PATCH "repos/${REPO}/issues/${new}" -f body="${new_body}" > /dev/null

          # Open this week's pull request.
          if [ -n "${current}" ]; then
            cur_branch="bug-fixes/fixes-${release:2}"
            if ! gh api "repos/${REPO}/git/matching-refs/heads/${cur_branch}" --jq '.[].ref' | grep -qxF "refs/heads/${cur_branch}"; then
              cur_branch=""
            fi
            if [ -z "${cur_branch}" ]; then
              summary "#${current} has no branch; nothing to open."
            else
              ahead=$(gh api "repos/${REPO}/compare/main...${cur_branch}" --jq '.ahead_by')
              existing=$(gh pr list --repo "${REPO}" --head "${cur_branch}" --state open --json number --jq '.[0].number // empty')
              if [ -n "${existing}" ]; then
                summary "#${existing} is already open for #${current}."
              elif [ "${ahead}" -eq 0 ]; then
                gh api -X PATCH "repos/${REPO}/issues/${current}" -f state=closed -f state_reason=completed > /dev/null
                gh api -X DELETE "repos/${REPO}/git/refs/heads/${cur_branch}" > /dev/null
                cur_ms=$(gh api "repos/${REPO}/issues/${current}" --jq '.milestone.number // empty')
                [ -z "${cur_ms}" ] || gh api -X PATCH "repos/${REPO}/milestones/${cur_ms}" -f state=closed > /dev/null
                summary "#${current} had no commits; closed it, its branch and its milestone."
              else
                conflict=""
                gh api -X POST "repos/${REPO}/merges" -f base="${cur_branch}" -f head=main -f commit_message="Merge main into ${cur_branch}" > /dev/null 2>&1 || conflict=yes
                fixed=$(gh api --paginate "repos/${REPO}/issues/${current}/sub_issues?per_page=100" --jq '.[] | select(.state == "closed") | "- #\(.number) \(.title)"')
                notes=$(gh api --paginate "repos/${REPO}/issues/${current}/sub_issues?per_page=100" --jq '.[] | select(.state == "closed") | "- Fixed: \(.title) (#\(.number))"')
                pr_body=$(printf 'Closes #%s\n\nFixes in this release:\n\n%s\n\n## Release note\n\n%s\n' "${current}" "${fixed}" "${notes:-none}")
                url=$(GH_TOKEN="${PR_TOKEN}" gh pr create --repo "${REPO}" --base main --head "${cur_branch}" --title "Fixes for ${release}" --body "${pr_body}" --label bug --milestone "${release}")
                if [ -z "${conflict}" ]; then
                  GH_TOKEN="${PR_TOKEN}" gh pr edit "${url}" --repo "${REPO}" --add-assignee dangerdd1 > /dev/null
                else
                  GH_TOKEN="${PR_TOKEN}" gh pr edit "${url}" --repo "${REPO}" --add-assignee ipsocode > /dev/null
                  GH_TOKEN="${PR_TOKEN}" gh pr edit "${url}" --repo "${REPO}" --add-label claude-fix > /dev/null
                fi
                summary "Opened ${url} for #${current}$([ -z "${conflict}" ] || echo ', with merge conflicts: labelled claude-fix')."
              fi
            fi
          fi

          # Close past milestones with nothing open.
          for ms in $(gh api --paginate "repos/${REPO}/milestones?state=open&per_page=100" --jq ".[] | select(.title | test(\"^[0-9]{4}-[0-9]{2}-[0-9]{2}\$\")) | select(.open_issues == 0 and .title < \"${today}\") | .number"); do
            gh api -X PATCH "repos/${REPO}/milestones/${ms}" -f state=closed > /dev/null
            summary "Closed milestone #${ms}."
          done
