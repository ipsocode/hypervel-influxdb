# Imported from ipsocode/hypervel-packages github/workflows/pages.yml. Edit it there.
name: pages

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or commit whose src/docs/ to publish. Empty = the latest v* tag
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    outputs:
      sha: ${{ steps.build.outputs.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Build the site
        id: build
        uses: ipsocode/hypervel-packages-ci/pages/build@7fc1b15e5073bb3ddb35b53b7d0f8e35bd4a68cb # v1
        with:
          ref: ${{ inputs.ref }}

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
