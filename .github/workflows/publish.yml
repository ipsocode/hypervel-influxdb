# Imported from ipsocode/hypervel-packages github/workflows/publish.yml. Edit it there.
name: publish

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Part of the latest v* tag to bump (ignored when `version` is given). `auto` = minor if a merged PR since the previous tag is labelled breaking-change or enhancement, else patch
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      version:
        description: 'Exact version instead, e.g. 1.0.0 or 0.2.0-rc.1 (leading v optional)'
        type: string
        default: ''
      highlights:
        description: Markdown placed above the generated notes. Empty = the Release note sections of the pull requests merged since the previous tag
        type: string
        default: ''
      dry_run:
        description: Plan and run the suite, but tag and release nothing
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      previous: ${{ steps.plan.outputs.previous }}
      breaking: ${{ steps.plan.outputs.breaking }}
      features: ${{ steps.plan.outputs.features }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Decide the version
        id: plan
        uses: ipsocode/hypervel-packages-ci/publish/plan@ed1673a0c70ab3fa9f5e93e804db084b51eeb34e # v1
        with:
          bump: ${{ inputs.bump }}
          version: ${{ inputs.version }}
          dry-run: ${{ inputs.dry_run }}

  tests:
    name: tests
    needs: plan
    if: needs.plan.outputs.mode != 'already-released'
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read
      issues: write
      pull-requests: write

  release:
    name: ${{ needs.plan.outputs.tag }}
    needs: [plan, tests]
    if: needs.plan.outputs.mode == 'tag-and-release' || needs.plan.outputs.mode == 'release-existing-tag'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout the planned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Write the notes, tag the commit and publish the release
        uses: ipsocode/hypervel-packages-ci/publish/release@ed1673a0c70ab3fa9f5e93e804db084b51eeb34e # v1
        with:
          mode: ${{ needs.plan.outputs.mode }}
          tag: ${{ needs.plan.outputs.tag }}
          sha: ${{ needs.plan.outputs.sha }}
          previous: ${{ needs.plan.outputs.previous }}
          highlights: ${{ inputs.highlights }}

  pages:
    name: pages
    needs: [plan, release]
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}
    permissions:
      contents: read
      pages: write
      id-token: write
