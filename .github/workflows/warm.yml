# Imported from ipsocode/hypervel-packages github/workflows/warm.yml. Edit it there.
name: warm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  OTEL_SDK_DISABLED: 'true'
  COMPOSER_CACHE_DIR: /tmp/composer-cache
  COMPOSER_MEMORY_LIMIT: '-1'
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'

jobs:
  caches:
    name: PHP ${{ matrix.php }} caches
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    concurrency:
      group: warm-${{ github.ref }}-${{ matrix.php }}
      cancel-in-progress: true

    container:
      image: ghcr.io/ipsocode/hypervel/ci:${{ matrix.php }}-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/composer-cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          composer update --prefer-dist --no-interaction --optimize-autoloader

      - name: Cache tests/.cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/.cache
          key: tests-cache-${{ matrix.php }}-${{ hashFiles('composer.json', 'phpstan.neon', 'phpunit.xml', '.php-cs-fixer.dist.php') }}-${{ github.sha }}
          restore-keys: tests-cache-${{ matrix.php }}-${{ hashFiles('composer.json', 'phpstan.neon', 'phpunit.xml', '.php-cs-fixer.dist.php') }}-

      - name: Run PHPStan
        continue-on-error: true
        run: vendor/bin/phpstan analyse --memory-limit 1G -c phpstan.neon --no-progress

      - name: Check code style
        if: matrix.php == '8.4'
        continue-on-error: true
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

  claude-code:
    name: Claude Code
    runs-on: ubuntu-latest
    timeout-minutes: 10

    concurrency:
      group: warm-${{ github.ref }}-claude-code
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find the Claude Code version the review's action installs
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/review.sh claude-version --strict

      - name: Look for it in the cache
        id: cache
        if: steps.version.outputs.version != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/claude/versions/${{ steps.version.outputs.version }}
          key: ${{ steps.version.outputs.key }}
          lookup-only: true

      - name: Install Claude Code
        id: setup
        if: steps.version.outputs.version != '' && steps.cache.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/review.sh claude-setup --version "${VERSION}" --strict

      - name: Save Claude Code
        if: steps.setup.outputs.path != '' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/claude/versions/${{ steps.version.outputs.version }}
          key: ${{ steps.version.outputs.key }}
