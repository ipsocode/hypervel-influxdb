# Imported from ipsocode/hypervel-packages github/workflows/owners.yml. Edit it there.
name: owners

on:
  pull_request:
    branches-ignore: [main]
    types: [review_requested]

permissions:
  pull-requests: write

jobs:
  withdraw:
    name: Withdraw the code-owner review request
    if: >-
      contains(fromJSON('["ipsocode", "dangerdd1"]'), github.event.requested_reviewer.login)
      && github.event.sender.login != github.event.requested_reviewer.login
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Withdraw the request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          REVIEWER: ${{ github.event.requested_reviewer.login }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          gh api -X DELETE "repos/${REPO}/pulls/${NUMBER}/requested_reviewers" -f "reviewers[]=${REVIEWER}" > /dev/null
          echo "Withdrew the review request for ${REVIEWER}: this pull request targets ${BASE}, and the code-owner review applies to pull requests into main only."
