# Imported from ipsocode/hypervel-packages github/workflows/checks.yml. Edit it there.
name: checks

on:
  workflow_run:
    workflows: [tests]
    types: [completed]

permissions:
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: checks-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  label:
    name: Ask for a fix
    if: >-
      github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Label the pull request claude-fix, or needs-human after three passes
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL_TOKEN: ${{ secrets.TRAIN_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if ! [[ "${HEAD_BRANCH}" =~ ^(bug-fixes|feature|routine)/ ]]; then
            echo "${HEAD_BRANCH} is not a train, feature or routine branch; nothing to do."
            exit 0
          fi

          pr=$(gh api -X GET "repos/${REPO}/pulls" -f state=open -f "head=${REPO%%/*}:${HEAD_BRANCH}" -f base=main --jq '.[0] // empty')
          if [ -z "${pr}" ]; then
            echo "No open pull request into main from ${HEAD_BRANCH}."
            exit 0
          fi
          number=$(jq -r '.number' <<< "${pr}")

          if [ "$(jq -r '.head.sha' <<< "${pr}")" != "${HEAD_SHA}" ]; then
            echo "#${number} has moved past ${HEAD_SHA}; a newer run decides."
            exit 0
          fi
          if [ "$(jq -r '.draft' <<< "${pr}")" = true ]; then
            echo "#${number} is a draft; its author runs the gate before each commit."
            exit 0
          fi
          if jq -e '.labels | map(.name) | any(. == "claude-fix" or . == "needs-human")' <<< "${pr}" > /dev/null; then
            echo "#${number} already carries claude-fix or needs-human."
            exit 0
          fi

          passes=$(gh api --paginate "repos/${REPO}/issues/${number}/events?per_page=100" \
            --jq '.[] | select(.event == "labeled" and .label.name == "claude-fix") | .id' | wc -l | tr -d ' ')

          if [ "${passes}" -ge 3 ]; then
            label=needs-human
            body="The checks failed on ${HEAD_SHA:0:7} after ${passes} fix passes, so this is labelled needs-human instead of claude-fix."
          else
            label=claude-fix
            body="The checks failed on ${HEAD_SHA:0:7}: labelled claude-fix (fix pass $((passes + 1)) of 3)."
          fi

          GH_TOKEN="${LABEL_TOKEN}" gh api -X POST "repos/${REPO}/issues/${number}/labels" -f "labels[]=${label}" > /dev/null
          GH_TOKEN="${LABEL_TOKEN}" gh api -X POST "repos/${REPO}/issues/${number}/comments" -f body="${body}" > /dev/null
          echo "Labelled #${number} ${label} after ${passes} earlier fix passes."
