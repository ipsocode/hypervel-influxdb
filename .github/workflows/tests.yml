# Imported from ipsocode/hypervel-packages github/workflows/tests.yml. Edit it there.
name: tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_call:

permissions:
  contents: read

env:
  RUN_BLOCKING_TESTS: 'true'
  OTEL_SDK_DISABLED: 'true'

jobs:
  initial:
    name: initial
    uses: ./.github/workflows/initial.yml

  php84:
    name: PHP 8.4
    needs: initial
    runs-on: ubuntu-latest
    timeout-minutes: 10

    concurrency:
      group: tests-${{ github.event.pull_request.number || github.ref }}-8.4
      cancel-in-progress: ${{ github.ref_name != 'main' }}

    container:
      image: ghcr.io/ipsocode/hypervel/ci-alpine:8.4-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ipsocode/hypervel-packages-ci/tests/install@7fc1b15e5073bb3ddb35b53b7d0f8e35bd4a68cb # v1
        with:
          php: '8.4'

      - name: Check style, analyse and run the suite under the coverage gate
        uses: ipsocode/hypervel-packages-ci/tests/suite@7fc1b15e5073bb3ddb35b53b7d0f8e35bd4a68cb # v1
        with:
          php: '8.4'
          style: 'true'
          min-coverage: '100'

  php85:
    name: PHP 8.5
    needs: initial
    runs-on: ubuntu-latest
    timeout-minutes: 7

    concurrency:
      group: tests-${{ github.event.pull_request.number || github.ref }}-8.5
      cancel-in-progress: ${{ github.ref_name != 'main' }}

    container:
      image: ghcr.io/ipsocode/hypervel/ci-alpine:8.5-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ipsocode/hypervel-packages-ci/tests/install@7fc1b15e5073bb3ddb35b53b7d0f8e35bd4a68cb # v1
        with:
          php: '8.5'

      - name: Analyse and run the suite
        uses: ipsocode/hypervel-packages-ci/tests/suite@7fc1b15e5073bb3ddb35b53b7d0f8e35bd4a68cb # v1
        with:
          php: '8.5'

  fix:
    name: Ask for a fix
    needs: [initial, php84, php85]
    if: >-
      failure()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.draft == false
      && (startsWith(github.head_ref, 'bug-fixes/') || startsWith(github.head_ref, 'feature/') || startsWith(github.head_ref, 'routine/'))
    runs-on: ubuntu-latest
    timeout-minutes: 3

    permissions:
      issues: write
      pull-requests: write

    concurrency:
      group: checks-${{ github.head_ref }}
      cancel-in-progress: false

    steps:
      - name: Ask for a fix
        uses: ipsocode/hypervel-packages-ci/tests/fix@7fc1b15e5073bb3ddb35b53b7d0f8e35bd4a68cb # v1
        with:
          label-token: ${{ secrets.TRAIN_TOKEN }}
