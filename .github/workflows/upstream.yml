# Imported from ipsocode/hypervel-packages github/workflows/upstream.yml. Edit it there.
name: upstream

on:
  schedule:
    - cron: '17 23 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Test main even if this components commit was tested already
        type: boolean
        default: false

permissions:
  contents: read

env:
  OTEL_SDK_DISABLED: 'true'

concurrency:
  group: upstream
  cancel-in-progress: false

jobs:
  watch:
    name: Watch
    runs-on: ubuntu-latest
    timeout-minutes: 3

    outputs:
      ref: ${{ steps.watch.outputs.ref }}
      tested: ${{ steps.watch.outputs.tested }}

    steps:
      - name: Read the head of hypervel/components 0.4, and look for an earlier run on it
        id: watch
        uses: ipsocode/hypervel-packages-ci/upstream/watch@ed1673a0c70ab3fa9f5e93e804db084b51eeb34e # v1

  test:
    name: PHP 8.4 on the latest components
    needs: watch
    if: needs.watch.outputs.tested != 'true' || inputs.force
    runs-on: ubuntu-latest
    timeout-minutes: 12

    outputs:
      ref: ${{ steps.components.outputs.ref }}

    container:
      image: ghcr.io/ipsocode/hypervel/ci-alpine:8.4-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        id: install
        uses: ipsocode/hypervel-packages-ci/tests/install@ed1673a0c70ab3fa9f5e93e804db084b51eeb34e # v1
        with:
          php: '8.4'
          restore-only: 'true'

      - name: Find the framework it installed
        id: components
        uses: ipsocode/hypervel-packages-ci/upstream/components@ed1673a0c70ab3fa9f5e93e804db084b51eeb34e # v1

      - name: Run PHPStan and the suite under the coverage gate
        uses: ipsocode/hypervel-packages-ci/tests/suite@ed1673a0c70ab3fa9f5e93e804db084b51eeb34e # v1
        with:
          php: '8.4'
          min-coverage: '100'
          upload-coverage: 'false'

      - name: Remember the commit was tested
        if: ${{ always() && steps.install.outcome == 'success' }}
        uses: ipsocode/hypervel-packages-ci/upstream/remember@ed1673a0c70ab3fa9f5e93e804db084b51eeb34e # v1
        with:
          ref: ${{ needs.watch.outputs.ref }}

  report:
    name: Report
    needs: [watch, test]
    if: ${{ always() && (needs.test.result == 'success' || needs.test.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3

    permissions:
      issues: write

    steps:
      - name: Open, update or close the components issue
        uses: ipsocode/hypervel-packages-ci/upstream/report@ed1673a0c70ab3fa9f5e93e804db084b51eeb34e # v1
        with:
          result: ${{ needs.test.result }}
          ref: ${{ needs.test.outputs.ref || needs.watch.outputs.ref }}
