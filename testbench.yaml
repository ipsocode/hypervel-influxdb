# Testbench / Workbench configuration for ipsocode/hypervel-influxdb.
#
# `workbench/` is the throwaway host application the package is tested against.
# Its config/influxdb.php holds the connections the suite resolves by default, in
# the shape a consuming application would publish.

providers:
  - Ipsocode\InfluxDB\InfluxDBServiceProvider

env:
  # Applied by the Testbench CLI (`composer test`, `testbench serve`) only, not by the
  # TestCase path, so nothing the suite asserts on may depend on it.
  APP_NAME: "Hypervel InfluxDB Workbench"
  APP_ENV: testing

workbench:
  # `config` and `commands` are the Workbench surfaces the suite needs; `install`
  # would only pull in Hypervel's testing migrations.
  install: false
  auth: false
  health: false
  discovers:
    config: true
    factories: false
    web: false
    api: false
    commands: true
    components: false
    views: false

purge:
  files:
    - .env
